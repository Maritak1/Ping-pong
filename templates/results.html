<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Rezultāti</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body>

    <div class="results">

        <h1>📊 Spēļu rezultāti</h1>

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>1. spēlētājs</th>
                    <th>2. spēlētājs</th>
                    <th>🏆 Uzvarētājs</th>
                </tr>
            </thead>

            <tbody id="resultsTable">
                <tr style="text-align: center; color: #d4af37;">
                    <td colspan="4">Spēļu vēl nav. Sāc pirmo!</td>
                </tr>
            </tbody>

        </table>

        <br><br>

        <button onclick="clearResults()" style="background: linear-gradient(135deg, #d9534f 0%, #c9302c 100%); border-color: #d9534f;">
            🗑️ Notīrīt rezultātus
        </button>

        <br><br>

        <a href="/">
            <button>⬅️ Atpakaļ uz sākumu</button>
        </a>

    </div>

    <script
        src="{{ url_for('static', filename='results.js') }}"
    ></script>

</body>
</html>
